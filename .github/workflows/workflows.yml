name: Build and Test .NET Desktop App

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        configuration: [Debug, Release]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore dependencies
        run: msbuild MyApp.sln /t:Restore /p:Configuration=${{ matrix.configuration }}

      - name: Build solution
        run: msbuild MyApp.sln /p:Configuration=${{ matrix.configuration }}

      - name: Run unit tests
        run: dotnet test TC01IfUserIsInvalidTryAgainTest.csproj --configuration ${{ matrix.configuration }} --verbosity normal

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BuildOutput
          path: '**/bin/${{ matrix.configuration }}/'
